{% extends 'main.html' %}
{% load static %}

{% block title %}
<title>Register User</title>
<link rel="stylesheet" href="{% static 'styles/formstyle.css' %}">
{% endblock %}

{% block content %}
<div class="container p-2">

    {% if messages %}
    {% for i in messages %}
    <p class="msg">{{i}}</p>
    {% endfor %}
    {% endif %}
    <div class="form-container row">
        <div class="box1 col-md-6">
            <h1 class="title">Register Form</h1>

            <form action="" method="POST" class="form1">
                {% csrf_token %}
                <label for="firstname" class="form-label mt-2">First Name</label>
                <input type="text" name="fname" id="firstname" class="form-control">

                <label for="lastname" class="form-label mt-2">Last Name</label>
                <input type="text" name="lname" id="lastname" class="form-control">

                <label for="email" class="form-label mt-2">Email</label>
                <input type="text" name="email" id="email" class="form-control">

                <label for="username" class="form-label mt-2">User Name</label>
                <input type="text" name="uname" id="username" class="form-control">

                <label for="password" class="form-label mt-2">Password</label>
                <input type="password" name="pasw" id="password" class="form-control">

                <label for="confirmpassword" class="form-label mt-2">Confirm Password</label>
                <input type="password" name="cpasw" id="confirmpassword" class="form-control">

                <button type="submit" class="btn btn-success my-3">Register</button>
            </form>
        </div>
        <div class="box1 col-md-6 d-none d-lg-flex">
            <img src="{% static 'images/register.jpg' %}" alt="">
        </div>
    </div>

</div>
{% endblock %}
