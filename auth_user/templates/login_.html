{% extends 'main.html' %}
{% load static %}

{% block title %}
<title>Login</title>
<link rel="stylesheet" href="{% static 'styles/formstyle.css' %}">
{% endblock %}

{% block content %}

<div class="container">

    {% if messages %}
    {% for i in messages %}
    <p class="msg">{{i}}</p>
    {% endfor %}
    {% endif %}
    <div class="form-container row">
        <div class="box1 col-md-6 d-none d-lg-flex">
            <img src="{% static 'images/login.jpg' %}" alt="">
        </div>
        <div class="box1 col-md-6">
            <h1 class="title my-2">Login</h1>
            <form action="" method="POST" class="form1 loginform">
                {% csrf_token %}
                <label for="username" class="form-label">User Name</label>
                <input type="text" name="uname" id="username" class="form-control" placeholder="Enter Username">

                <label for="password" class="form-label mt-3">Password</label>
                <div class="input-group">
                    <input type="password" name="pasw" id="password" class="form-control" placeholder="Enter Password"
                    aria-label="Input group example" aria-describedby="btnGroupAddon" style="border-right: none;">
                    <div style="cursor: pointer;" class="input-group-text bg-white" id="btnGroupAddon" onclick="showPassword(event)"><i class="fa-solid fa-eye"></i></div>
                </div>


                <button type="submit" class="btn btn-success my-3">Login</button>
            </form>
            <a href="{% url 'forgetPasw' %}">Forget Password?</a>
        </div>
    </div>

</div>



<script>
    let password=document.getElementById('password')
    let btnGroupAddon=document.getElementById('btnGroupAddon')
    const showPassword=()=>{
        if(password.type=='password')
        {
            btnGroupAddon.innerHTML=`<i class="fa-solid fa-eye-slash"></i>`
            password.type='text'
        }
        else
        {
            btnGroupAddon.innerHTML=`<i class="fa-solid fa-eye"></i>`
            password.type='password'
        }
    }
</script>
{% endblock %}
