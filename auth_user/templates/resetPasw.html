{% extends 'main.html' %}
{% load static %}

{% block title %}
    <title>Reset Password</title>
    <link rel="stylesheet" href="{% static 'styles/formstyle.css' %}">
{% endblock %}

{% block content %}

    <div class="container">

    {% if messages %}
        {% for i in messages %}
          <p class="msg">{{i}}</p>
        {% endfor %}
    {% endif %}

    <div class="form-container-pasw">
    <h1 class="title">Reset Password</h1>
    <form action="" method="POST" class="form1">
        {% csrf_token %}
        {% if new %}
            <label for="newpasw" class="form-label mt-2">New Password</label>
            <input type="password" name="newpasw" id="newpasw" class="form-control">

            <label for="cnewpasw" class="form-label mt-2">Confirm New Password</label>
            <input type="password" name="cnewpasw" id="cnewpasw" class="form-control">
        {% else %}
            <label for="oldpasw" class="form-label">Old Password</label>
            <input type="password" name="oldpasw" id="oldpasw" class="form-control">
        {% endif %}
        <button type="submit" class="btn btn-success mt-3">Confirm</button>
    </form>
    </div>
    </div>
{% endblock %}
